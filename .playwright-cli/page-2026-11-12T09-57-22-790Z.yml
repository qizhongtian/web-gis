                - code [ref=f2e618]: "const nfs = new C.NearFarScalar( 300, // near：相机距离 300 m 以内 2.2, // nearValue：scale 固定 2.2（已经到上限，不会无限放大） 12000, // far：相机距离 12000 m 以外 0.25, // farValue：scale 固定 0.25（已经到下限，不会缩成 0） ) const bb = collection.add({ position, image: '/image/map-pin-02.png', width: 30, height: 38, verticalOrigin: C.VerticalOrigin.BOTTOM, scaleByDistance: nfs, // ← 就这一行 }) // 渲染时 Cesium 自己算：distance <= near → nearValue // distance >= far → farValue // 中间按距离线性插值 // 所以两端天然有上下限，不需要自己 clamp"

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 的最小权限：读仓库 + 发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支只保留最新一次部署，避免并发写 Pages
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall 会执行 scripts/sync-vendor.mjs，把 cesium / ol / leaflet 拷进 public
      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 项目站点在 /<仓库名>/；<user>.github.io 这类用户站点在根路径
      - name: Resolve base path
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "VITE_BASE=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE=/$REPO/" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          # 没有后端，启用浏览器端静态 mock（admin / 123456）
          VITE_STATIC_MOCK: '1'
          # 可选：自定义地形服务地址。不配置时全部示例使用全球高程（ArcGIS，免密钥）
          # 如需自建 quantized-mesh / 反代，在 Settings → Secrets and variables → Actions → Variables 新建该变量
          VITE_HK_TERRAIN_URL: ${{ vars.VITE_HK_TERRAIN_URL }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
